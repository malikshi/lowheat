name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pytest-cov
      - run: python -m pytest -q --cov --cov-report=term-missing
      - run: python .agents/skills/agents-contract/scripts/codedna_check.py . contract
      - run: python .agents/skills/agents-contract/scripts/comment_budget.py . --baseline docs/comment-budget.json
      - name: Baseline may only shrink
        run: |
          ref="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$ref" ] && git cat-file -e "$ref:docs/comment-budget.json" 2>/dev/null; then
            git show "$ref:docs/comment-budget.json" > /tmp/base-budget.json
            python .agents/skills/agents-contract/scripts/comment_budget.py \
              --baseline docs/comment-budget.json --against /tmp/base-budget.json
          else
            echo "no prior baseline to compare; first commit of the ratchet"
          fi
